equations:
- id: statistical_shells
  revision: '1'
  latex: g_n=2n^2,\quad p_{n\ell}=\frac{2\ell+1}{n^2},\\\overline{A}_{nj}=\sum_{\ell=0}^{n-1}p_{n\ell}\sum_{k\in
    j}A_{n\ell,k},\qquad\overline{\sigma}_n(\nu)=\sum_{\ell=0}^{n-1}p_{n\ell}\sigma_{n\ell}(\nu)
  description: The added shells distribute population statistically over orbital states and sum each physical
    transition into its destination group.
  scope: Resolved 1s,2s,2p,3s,3p,3d; collapsed shells 4 through N, with 3<=N<=20.
  symbols:
    principal:
      latex: n
      description: Principal quantum number
      unit: '1'
    orbital:
      latex: \ell
      description: Orbital quantum number
      unit: '1'
    weight:
      latex: g_n,p_{n\ell}
      description: State degeneracy and orbital population fraction
      unit: '1'
    einstein_a:
      latex: A,\overline A
      description: Spontaneous electric-dipole rate
      unit: s^-1
    cross_section:
      latex: \sigma,\overline\sigma
      description: Photoionization cross section
      unit: cm^2
    frequency:
      latex: \nu
      description: Ordinary photon frequency
      unit: Hz
    maximum_shell:
      latex: N
      description: Largest included principal shell
      unit: '1'
  assumptions:
  - Statistical orbital populations in the collapsed shells are an approximation, not a new resolved high-l
    kinetic model.
  - Low-level energies and transition rates retain the selected original data.
  - Every retained shell has explicit recombination, ionization and cascade paths; omitted shells have
    no artificial top-off source.
  evidence:
  - formulation
- id: radial_dipoles
  revision: '1'
  latex: \widetilde R_{n\ell}(u)=\frac{2}{n^2}\sqrt{\frac{(n-\ell-1)!}{(n+\ell)!}}e^{-u/n}\left(\frac{2u}{n}\right)^\ell
    L_{n-\ell-1}^{2\ell+1}\!\left(\frac{2u}{n}\right),\\ d_{n\ell,n^\prime\ell^\prime}=a_{\rm H}\int_0^\infty
    u^3\widetilde R_{n\ell}(u)\widetilde R_{n^\prime\ell^\prime}(u)\,du,\\ A_{n\ell,n^\prime\ell^\prime}=\frac{64\pi^4
    e^2\nu^3}{3hc^3}\frac{\max(\ell,\ell^\prime)}{2\ell+1}d^2_{n\ell,n^\prime\ell^\prime}
  description: Hydrogenic electric-dipole radial integrals; exact rational polynomial integration prevents
    cancellation in the static construction.
  scope: 1<=n,nprime<=20; n>nprime and |l-lprime|=1 for a downward radiative transition.
  symbols:
    radius:
      latex: u=r/a_{\rm H}
      description: Dimensionless radius
      unit: '1'
    radial:
      latex: d
      description: Radial dipole integral
      unit: cm
    einstein_a:
      latex: A
      description: Spontaneous rate averaged over upper magnetic states
      unit: s^-1
    frequency:
      latex: \nu
      description: Finite-state transition frequency
      unit: Hz
    n_upper:
      latex: n
      description: Upper principal quantum number
      unit: '1'
    l_upper:
      latex: \ell
      description: Upper orbital quantum number
      unit: '1'
    n_lower:
      latex: n^\prime
      description: Lower principal quantum number
      unit: '1'
    l_lower:
      latex: \ell^\prime
      description: Lower orbital quantum number
      unit: '1'
    bohr_radius:
      latex: a_{\rm H}
      description: Protium reduced-mass Bohr radius used by the bound-bound construction
      unit: cm
  assumptions:
  - The Bohr radius uses the declared protium reduced-mass correction.
  - Polynomial summation is exact rational arithmetic; the final normalization and returned rates use
    float64.
  - This static atomic construction is independent of differentiable gas parameters.
  evidence:
  - radial_source
  - formulation
- id: coulomb_bound_free
  revision: '1'
  latex: "E=\\frac{h\\nu}{\\chi_{n\\ell}},\\quad t^2=\\max(E-1,0),\\quad \\mathcal E=1+t^2,\\quad k=t/n,\\\
    \\\n\\log G_* =\\tfrac12\\log(\\pi/2)+\\log(8n)+n\\log(4n)-\\log\\Gamma(2n)\\\\\n\\hspace{7mm}-2n\\\
    frac{\\arctan t}{t}-\\tfrac12\\log(1-\\exp[-2\\pi/k])-(n+2)\\log\\mathcal E,\\\\\n\\log D_{n\\ell,\\\
    ell'}^2=\\log\\frac{(n+\\ell)!}{(n-\\ell-1)!}\n +\\sum_{s=1}^{\\ell'}\\log(1+s^2k^2)+2(\\ell-n)\\\
    log(2n)\\\\\n\\hspace{7mm}+2[\\log G_*+p_\\ell^\\pm\\log\\mathcal E+\\log|H_\\ell^\\pm|],\\\\\np_\\\
    ell^+=n-1-\\ell,\\quad p_\\ell^-=n-\\ell,\\\\\n\\sigma_{n\\ell}(\\nu)=\\frac{4\\pi\\alpha a_0^2n^2}{3}\n\
    \ \\sum_{\\ell'=\\ell\\pm1\\ge0}\\frac{\\max(\\ell,\\ell')}{2\\ell+1}\\,\\mathcal E\\,\\exp(\\log\
    \ D_{n\\ell,\\ell'}^2)"
  description: Coulomb-wave cross sections recombine the normalized radial recurrence in logarithmic form.
  scope: 1<=n<=20; cross section zero for E<1. Plus/minus denotes continuum lprime=l+1/l-1. Each finite
    state uses its actual threshold.
  symbols:
    principal:
      latex: n
      description: Principal quantum number
      unit: '1'
    orbital:
      latex: \ell
      description: Bound-state orbital quantum number
      unit: '1'
    energy:
      latex: E
      description: Photon energy divided by the actual threshold
      unit: '1'
    radial:
      latex: G_*,H^\pm,D
      description: Coulomb radial normalization, normalized recurrence and dipoles
      unit: '1'
    cross_section:
      latex: \sigma_{n\ell}
      description: Orbital photoionization cross section
      unit: cm^2
    bohr_radius:
      latex: a_0
      description: Bohr radius 5.29177210903e-9 cm used in the bound-free normalization
      unit: cm
  assumptions:
  - At threshold arctan(t)/t tends to one; a small-t series preserves the derivative.
  - Computing the logarithm of the product avoids squaring tiny dipoles before compensating factors are
    applied.
  - Both photoionization and the inverse Milne process use this same cross section.
  - The support limit n<=20 is explicit; successful tests at sampled energies do not prove an unlimited
    high-n domain.
  evidence:
  - brocklehurst_source
  - formulation
- id: normalized_coulomb_recurrence
  revision: '1'
  latex: 'G_q^+=G_*\mathcal E^{n-1-q}H_q^+,\quad G_q^-=G_*\mathcal E^{n-q}H_q^-,\\

    H^+_{n-1}=1,\quad H^+_{n-2}=n(2n-1),\\

    H^-_{n-1}=\frac1{2n},\quad H^-_{n-2}=(2n-1)\left(\frac4{\mathcal E}+n-1\right)H^-_{n-1},\\

    A_q^+=\frac{4n^2-4(q+2)^2}{\mathcal E}+(q+2)(2q+3),\\

    B_q^+=\frac{4n^2[n^2-(q+2)^2][1+(q+3)^2k^2]}{\mathcal E^2},\\

    A_q^-=\frac{4n^2-4(q+1)^2}{\mathcal E}+(q+1)(2q+3),\\

    B_q^-=\frac{4n^2[n^2-(q+2)^2][1+(q+1)^2k^2]}{\mathcal E^2},\\

    H_q^\pm=A_q^\pm H_{q+1}^\pm-B_q^\pm H_{q+2}^\pm'
  description: Energy-normalized Brocklehurst recurrence, algebraically equivalent to the earlier unscaled
    radial recurrence.
  scope: Plus runs q=n-3,...,0; minus runs q=n-3,...,1. Initial values are used only when their indices
    exist. The noncontributing n=1 minus seed is never evaluated as a dipole.
  symbols:
    principal:
      latex: n
      description: Principal quantum number
      unit: '1'
    energy:
      latex: E
      description: Photon energy divided by threshold; the clipped energy is max(E,1)
      unit: '1'
    continuum:
      latex: k
      description: Dimensionless continuum momentum
      unit: '1'
    radial:
      latex: H_q^\pm
      description: Energy-normalized radial factors
      unit: '1'
  assumptions:
  - Each downward step removes one power of the clipped photon energy before forming the recurrence.
  - The algorithm is a provider-derived rescaling of the inspected Cloudy/Brocklehurst recurrence, not
    an empirical population adjustment.
  evidence:
  - brocklehurst_source
  - formulation
- id: higher_shell_ionization
  revision: '1'
  latex: u=\frac{k_{\rm B}T}{1\,\mathrm{eV}},\quad\epsilon_n=\frac{\chi_n}{k_{\rm B}T},\\q_n^{\rm ion}=\frac{9.56\times10^{-6}e^{-\epsilon_n}}{u^{3/2}[\epsilon_n^{2.33}+4.38\epsilon_n^{1.72}+1.32\epsilon_n]},\\q_n^{\rm
    3b}=q_n^{\rm ion}\frac{g_n}{2}\left(\frac{h^2}{2\pi m_e k_{\rm B}T}\right)^{3/2}e^{\chi_n/(k_{\rm
    B}T)}
  description: VS80 Eq. 8 supplies the added-shell electron ionization rate; its three-body inverse uses
    the same state energy and statistical weight.
  scope: Only collapsed n=6,...,20 use this extension. The retained n<=5 collision/ionization prescriptions
    remain distinct.
  symbols:
    temperature:
      latex: T
      description: Gas temperature
      unit: K
    binding:
      latex: \chi_n
      description: Actual finite-state ionization threshold
      unit: erg
    rate:
      latex: q_n^{\rm ion}
      description: Electron-impact ionization coefficient
      unit: cm^3 s^-1
    inverse:
      latex: q_n^{\rm 3b}
      description: Three-body recombination coefficient
      unit: cm^6 s^-1
  assumptions:
  - Maxwellian electrons; the VS80 fit is an adopted approximation.
  - The retained low-level data restrict the shared gas-temperature domain.
  evidence:
  - vs80_source
  - formulation
- id: finite_charge_root
  revision: '1'
  latex: "P_{ij}=R_{ij}+n_e q_{ij},\\quad\n M=\\operatorname{diag}\\!\\left(\\sum_jP_{ij}+\\Gamma_i+n_e\
    \ q_i^{\\rm ion}\\right)-P^{\\mathsf T},\\\\\ns_i=n_e\\alpha_i+n_e^2q_i^{\\rm 3b},\\quad b=M^{-1}s,\\\
    \\\nn_e=n_p=n_{\\rm H}e^z,\\quad n_i=n_e b_i,\\quad F(z;\\theta)=z+\\log(1+\\mathbf1^{\\mathsf T}b)=0,\\\
    \\\n\\frac{dz}{d\\theta}=-\\frac{\\partial_\\theta F}{\\partial_z F}"
  description: The retained charge-conserving statistical-equilibrium root is solved for the enlarged
    rate matrix and differentiated implicitly.
  scope: Pure H, nonnegative finite rates with a positive photoionization rate, nonsingular bound-state
    matrix, isolated scalar charge root. Gas and radiation inputs are prescribed in this local comparison.
  symbols:
    density:
      latex: n_{\rm H}
      description: Hydrogen nucleus number density
      unit: cm^-3
    temperature:
      latex: T
      description: Prescribed gas temperature
      unit: K
    electron:
      latex: n_e=n_p
      description: Electron and proton density
      unit: cm^-3
    population:
      latex: n_i
      description: Bound-state populations
      unit: cm^-3
    ratio:
      latex: b_i
      description: Bound-to-proton population ratio
      unit: '1'
    rate:
      latex: P,R,\Gamma,M,s
      description: Transition rates, loss matrix and source per proton
      unit: s^-1
    coefficient:
      latex: q_{ij},q_i^{\rm ion},\alpha_i
      description: Two-body rate coefficients
      unit: cm^3 s^-1
    three_body:
      latex: q_i^{\rm 3b}
      description: Three-body coefficient
      unit: cm^6 s^-1
    root:
      latex: z,F
      description: Log ionized fraction and conservation residual
      unit: '1'
  assumptions:
  - Orbital mixing coefficients remain inside the density-dependent rate callback.
  - The implicit derivative follows the converged equations, including rate feedback, rather than differentiating
    the bisection iterations.
  - The gas-temperature limits of the retained low-level atomic data remain applicable.
  evidence:
  - formulation
- id: shell_change
  revision: '1'
  latex: \Delta_s(N,N_{\rm ref})=\left|\frac{n_s(N_{\rm ref})}{n_s(N)}-1\right|,\qquad\max_{s\in\{2,3\}}\Delta_s(15,20)\le0.05
