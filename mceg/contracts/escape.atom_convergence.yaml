    revision: '1'
  - id: finite_charge_root
    revision: '1'
- id: extended_numerics
  revision: '1'
  kind: numerical_verification
  statement: The enlarged atom passes its recorded atomic, quadrature and forward/reverse implicit-gradient
    checks and selected coupled regressions.
  scope: Exactly the retained numerical tests and tolerances; no continuous-domain guarantee or posterior
    convergence.
  equations:
  - id: statistical_shells
    revision: '1'
  - id: radial_dipoles
    revision: '1'
  - id: coulomb_bound_free
    revision: '1'
