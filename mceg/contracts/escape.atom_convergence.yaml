    revision: '1'
  - id: finite_charge_root
    revision: '1'
- id: extended_shell_convergence
  revision: '1'
  kind: numerical_verification
  statement: Increasing the atom from N=15 to 20 changes each of n2 and n3 by no more than five percent
    in all seven registered conditions.
  scope: The seven points in atom_convergence_cases.json, not their Cartesian product or the infinite-atom
    limit.
  equations:
  - id: shell_change
    revision: '1'
- id: matched_reference_agreement
  revision: '1'
  kind: numerical_verification
  statement: Each n2 and n3 value agrees with the matched independent Cloudy finite atom within five percent
    in all 14 registered cases.
  scope: N=15 and 20 at the seven registered conditions; matching finite-model populations does not validate
    the full atmosphere.
  equations: []
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The adopted finite atomic closure is adequate for the intended escaping planetary atmosphere.
  scope: No independent full-atmosphere tolerance or validation is established.
  equations: []
