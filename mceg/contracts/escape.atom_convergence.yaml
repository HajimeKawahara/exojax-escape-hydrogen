schema_version: '0.4'
model:
  id: escape.atom_convergence
  name: Finite hydrogen atom with verified shell extension
  description: Extend explicit statistical shells through N<=20, adopt N=15 from scoped convergence/reference
    evidence, and retain numerical/physical distinctions.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 246e340658008a8f355c345333571d75dd1e66e9
    entry_points:
    - src/escape/hydrogen_atom.py:make_hydrogen_atom
    - src/escape/hydrogen_atom.py:hydrogenic_radial_dipole
    - src/escape/hydrogen_atom.py:hydrogenic_einstein_a
    - src/escape/hydrogen_bound_free.py:hydrogenic_cross_section
    - src/escape/hydrogen_bound_free.py:_orbital_cross_sections
    - src/escape/hydrogen_atom.py:atom_collision_rates
    - src/escape/hydrogen_nlte.py:_solve_equilibrium_with_rates
    - src/escape/hydrogen_atom.py:solve_atom_populations
    - tests/test_atom_convergence.py:test_enlarged_atom_shell_sensitivity
assumptions:
- statement: Pure hydrogen; n<=3 resolved, n>=4 statistical orbital populations; prescribed radiation
    and gas temperature for the local comparisons.
  evidence:
  - formulation
- statement: Every retained shell has explicit forward/inverse rates. No top-off population, Case-B replacement
    or fitted population scale repairs the truncation boundary.
  evidence:
  - formulation
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Declared API and retained low-level data limitations, separate from the discrete accuracy
    checks.
  conditions:
  - JAX float64; integer 3<=N<=20; default N=15.
  - Gas temperature 5802.26--14000 K; finite positive density/radiation inputs and an isolated charge
    root.
  evidence:
  - implementation
  - formulation
- kind: scientific_applicability
  status: unknown
  description: No full-atmosphere accuracy envelope has been established.
  conditions: []
  evidence:
  - formulation
claims:
- id: extended_formulation
  revision: '1'
  kind: theoretical
  statement: The recorded shell, radial, continuum, ionization and charge-root equations correspond to
    the selected enlarged implementation.
  scope: Formulation and implementation correspondence only; adopted physical closures remain explicit.
  equations:
  - id: statistical_shells
    revision: '1'
  - id: radial_dipoles
    revision: '1'
  - id: coulomb_bound_free
    revision: '1'
