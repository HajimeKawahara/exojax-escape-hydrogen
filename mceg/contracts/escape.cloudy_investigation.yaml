schema_version: '0.4'
model:
  id: escape.cloudy_investigation
  name: 'Cloudy discrepancy: attribution, repair and repeated verification'
  description: Retain the failed baseline, test discriminating hypotheses and evaluate physically sourced repairs
    against unchanged comparison criteria.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: e59137ba4a37283bcfbd1f00c311adb5829a16a4
    entry_points:
    - src/escape/hydrogen_bound_free.py:hydrogenic_cross_section
    - src/escape/hydrogen_bound_free.py:resolved_atom_cross_sections
    - src/escape/hydrogen_mixing.py:proton_l_mixing_psm20
    - src/escape/hydrogen_mixing.py:mixing_bound_bound_cm3_s
    - src/escape/hydrogen_atom.py:atom_bound_free_rates
    - src/escape/hydrogen_atom.py:solve_atom_populations
    - src/escape/hydrogen_nlte.py:_solve_equilibrium_with_rates
    - src/escape/hydrogen_nlte.py:solve_statistical_equilibrium
    - src/escape/hydrogen_continuum.py:continuum_coefficients
    - src/escape/coupled_hydrogen.py:CoupledHydrogenModel.radiation_state
    - src/escape/coupled_hydrogen.py:CoupledHydrogenModel.solve_equilibrium
    - src/escape/coupled_hydrogen.py:CoupledHydrogenModel.solve_flow
assumptions:
- statement: Cloudy is an external comparison model with explicit atomic and geometric choices, not experimental
    truth.
  evidence:
  - protocol_record
domains:
- kind: scientific_applicability
  status: unknown
  description: No empirical atmospheric applicability follows from agreement with another code.
  conditions: []
  evidence:
  - protocol_record
- kind: numerical_evaluation
  status: documented
  description: Registered finite-atom baseline and factorized validation cases.
  conditions:
  - 'Baseline: T9000 K, nH1e12 cm^-3, Trad10000 K, dilution0.025, nmax4 and5.'
  - The held-out cases are exactly those in cloudy_validation_cases.json; they are not a Cartesian-product
    domain.
  - Original five-percent comparison thresholds are not relaxed after seeing outcomes.
  evidence:
  - protocol_record
claims:
- id: original_reference_agreement
  revision: '1'
  kind: numerical_verification
  statement: The original finite atom meets the five-percent n2/n3 comparison target at the recorded baseline.
  scope: Known failed proposition; retained as counterevidence, not promoted by successful solver execution.
- id: same_system_solver_identity
  revision: '1'
  kind: numerical_verification
  statement: An independent solve of the extracted Cloudy rate system reproduces its populations.
  scope: The same matrix and source vector only; this does not equate different atomic models.
- id: input_or_numerical_mismatch
  revision: '1'
  kind: numerical_verification
  statement: Input conventions and discretization account for the observed population discrepancy.
  scope: Compare actual density, electron density, temperature, intensity normalization and numerical controls.
- id: orbital_mixing
  revision: '1'
  kind: numerical_verification
  statement: The missing n=3 orbital mixing block explains at least 80 percent of the baseline absolute n3
    discrepancy and its removal restores the discrepancy.
  scope: A controlled forward and reverse rate-block intervention at the registered point; no global physical
    accuracy claim.
- id: bound_free_data
  revision: '1'
  kind: numerical_verification
  statement: Level-resolved bound-free rates make a measurable independent contribution to the discrepancy.
  scope: Swap a consistent photoionization/recombination block and inspect interactions with mixing.
- id: collision_data
  revision: '1'
  kind: numerical_verification
  statement: The remaining collisional rates contribute materially after controlling mixing and bound-free
    data.
  scope: A contribution or a bounded residual must be recorded, rather than silently assuming equal data.
- id: finite_atom_definition
  revision: '1'
  kind: numerical_verification
  statement: Different finite-atom topology or cascade closure explains the matched-model discrepancy.
  scope: Compare actual resolved/collapsed states and top-off; atom-size convergence is a separate requirement.
- id: repaired_reference_agreement
  revision: '1'
  kind: numerical_verification
  statement: The repaired model meets the unchanged five-percent n2/n3 criterion for every registered comparison
    case with its numerical verification intact.
  scope: The explicit eight cases only. This is controlled code agreement, not infinite-atom or planetary-atmosphere
    validation.
  equations:
  - id: density_dependent_charge_root
    revision: '1'
  - id: psm20_cross_section
    revision: '1'
  - id: mixing_inverse_pair
    revision: '1'
  - id: hydrogenic_bound_free
    revision: '1'
  - id: brocklehurst_recurrence
    revision: '1'
  - id: paired_continuum_kernels
    revision: '1'
- id: repaired_definition
  revision: '1'
  kind: theoretical
  statement: The declared rate equations and source bindings describe the physical repairs and the differentiable
    charge closure.
  scope: Definition and implementation correspondence; no physical accuracy follows from authored equations.
  equations:
  - id: density_dependent_charge_root
    revision: '1'
  - id: psm20_cross_section
    revision: '1'
  - id: mixing_inverse_pair
    revision: '1'
  - id: hydrogenic_bound_free
    revision: '1'
  - id: brocklehurst_recurrence
    revision: '1'
  - id: paired_continuum_kernels
    revision: '1'
- id: n2_mixing_convention
  revision: '1'
  kind: numerical_verification
  statement: The paired n=2 collision closure explains at least 80 percent of the dilute-case absolute n2 discrepancy,
    with a reverse substitution restoring that discrepancy.
  scope: Matched nmax5 T9000 K nH1e10 case only; a legitimate model-choice difference rather than a demonstrated
    bug in the legacy formula.
- id: historical_repaired_case_comparison
  revision: '1'
  kind: numerical_verification
  statement: The pre-optimization repaired source at 0fa8bc9 meets the eight registered population comparison
    criteria and reference refinement controls.
  scope: Historical population-comparison result only. The associated numerical workflow still required fixture
    correction and later performance work; this is not the final combined completion claim.
- id: current_numerical_consistency
  revision: '1'
  kind: numerical_verification
  statement: The repaired implementation passes its declared ten numerical gates, including the retained prescribed-rate
    API and density-dependent implicit gradients.
  scope: Actual saved numerical test cases; neither posterior convergence nor physical atmospheric accuracy
    is inferred.
  equations:
  - id: density_dependent_charge_root
    revision: '1'
  - id: psm20_cross_section
    revision: '1'
  - id: mixing_inverse_pair
    revision: '1'
  - id: hydrogenic_bound_free
    revision: '1'
  - id: brocklehurst_recurrence
    revision: '1'
  - id: paired_continuum_kernels
    revision: '1'
- id: current_atom_truncation
  revision: '1'
  kind: numerical_verification
  statement: The repaired atom changes n3 by no more than five percent when maximum shell increases from four
    to five at the declared baseline.
  scope: A necessary sampled truncation check; even a passing result would not prove infinite-atom convergence.
