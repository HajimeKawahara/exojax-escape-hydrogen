equations:
- id: density_dependent_charge_root
  revision: '1'
  latex: 'P_{ij}=R_{ij}+n_e C^{e}_{ij}+n_p C^{p}_{ij}(T,n_e),\quad n_e=n_p=n_{\rm H}e^z,\\

    M_{ij}=\delta_{ij}\!\left[\sum_kP_{ik}+\Gamma_i+n_eq_i^{\rm ion}\right]-P_{ji},\\

    M\boldsymbol b=n_e\boldsymbol\alpha+n_e^2\boldsymbol q^{(3)},\quad n_i=n_e b_i,\\

    F(z;\theta)=z+\log\!\left(1+\sum_i b_i(n_{\rm H}e^z;\theta)\right)=0,\\

    \frac{\partial z}{\partial\theta}=-\frac{F_\theta}{F_z}'
  description: Density-dependent orbital rates are evaluated inside the charge-conserving root and its implicit
    derivative.
  scope: Prescribed local radiation and positive photoionization; the coupled residual uses the same rate callback.
  symbols:
    temperature: &id004
      latex: T
      description: Common electron and proton kinetic temperature
      unit: K
    electron_density: &id005
      latex: n_e
      description: Electron density, equal to proton density in pure hydrogen
      unit: cm^-3
    density:
      latex: n_{\rm H}
      description: Total hydrogen-nucleus density
      unit: cm^-3
    log_fraction:
      latex: z
      description: Log ionized fraction
      unit: '1'
    rates:
      latex: R,C,\Gamma,\alpha,q^{\rm ion},q^{(3)}
      description: Radiative, binary and three-body rate coefficients
      unit: s^-1, cm^3 s^-1, cm^6 s^-1
    ratios:
      latex: b_i
      description: Bound population divided by proton density
      unit: '1'
    parameters:
      latex: \theta
      description: External density, temperature and radiation inputs
      unit: various
  assumptions:
  - Pure H, ne=np; the bound-state loss matrix is nonsingular.
  - The bracket is -80<=z<=0. The locally positive F_z is checked; derivatives describe a converged root, not
    the bisection iterations.
  evidence:
  - authored_rate_formulation
- id: psm20_cross_section
  revision: '1'
  latex: 'u(E)=\sqrt{\frac{E}{\mathrm{Ry}}\frac{m_e}{\mu}},\quad

    D=\frac{3n^2\ell(n^2-\ell^2)}{2\ell+1},\quad R_1=a_0\sqrt{\frac{4D}{u^2}},\\

    R_D=\sqrt{\frac{k_{\rm B}T}{4\pi n_e e^2}},\quad

    R_\tau=0.72\tau\frac{a_0}{t_0}u,\quad R_c=\min(R_D,R_\tau),\\

    \sigma(E)=\frac{\pi R_1^2}{4}\begin{cases}

    \frac23+2\log(R_c/R_1),&R_c\ge R_1,\\

    \frac23(R_c/R_1)^3,&R_c<R_1,

    \end{cases}\\

    q_{n\ell\to n,\ell-1}=\sqrt{\frac{8}{\pi\mu}}(k_{\rm B}T)^{-3/2}

    \int_0^\infty E\sigma(E)e^{-E/(k_{\rm B}T)}\,dE'
  description: PSM20 final-state-resolved impact-parameter cross section with both cutoffs integrated continuously.
  scope: Proton-driven n=2,3 orbital mixing; same-n states are degenerate in the cross section, with actual
    energy differences in the inverse rate.
  symbols:
    temperature: *id004
    electron_density: *id005
    principal:
      latex: n
      description: Principal quantum number
      unit: '1'
    orbital:
      latex: \ell
      description: Departing orbital quantum number
      unit: '1'
    lower_orbital:
      latex: \ell-1
      description: Final orbital quantum number
      unit: '1'
    lifetime:
      latex: \tau
      description: Departing state spontaneous lifetime
      unit: s
    mass:
      latex: \mu
      description: Neutral-protium/proton reduced mass
      unit: g
    energy:
      latex: E
      description: Collision kinetic energy
      unit: erg
    rate:
      latex: q
      description: Maxwellian binary rate coefficient
      unit: cm^3 s^-1
    radii:
      latex: R_1,R_D,R_\tau,R_c
      description: Matching, electron-Debye, lifetime and selected cutoff radii
      unit: cm
    atomic_units:
      latex: a_0,t_0,\mathrm{Ry}
      description: Bohr length, time and Rydberg energy
      unit: cm, s, erg
  assumptions:
  - P1=1/4 for one resolved final state; the projectile charge is one.
  - The lifetime is computed from the sum of spontaneous transitions out of the departing state.
  - Unlike the C23 shortcut, the lifetime/Debye minimum is integrated at every density; this intentionally
    removes the shortcut jump.
  - No electron orbital-mixing channel or population fit is added to this chosen finite-atom closure.
  evidence:
  - psm20_source
  - authored_rate_formulation
- id: mixing_inverse_pair
  revision: '1'
  latex: 'C^p_{lu}=\frac{g_u}{g_l}\exp\!\left[-\frac{E_u-E_l}{k_{\rm B}T}\right]C^p_{ul},\\

    (u,l)\in\{(2p,2s),(3p,3s),(3d,3p)\},\qquad

    P^{\rm mix}_{ij}=n_pC^p_{ij}'
  description: The paired orbital transitions obey the finite atom energy and statistical-weight convention.
  scope: The finite atom replaces, rather than adds to, the previous 2s-2p fit. The historical six-state API
    keeps that fit.
  symbols:
    temperature: *id004
    electron_density: *id005
    coefficient:
      latex: C^p_{ij}
      description: Proton collision coefficient
      unit: cm^3 s^-1
    weight:
      latex: g_i
      description: Finite-state statistical weight
      unit: '1'
    excitation:
      latex: E_i
      description: Finite-state excitation energy
      unit: erg
  assumptions:
  - Pure H makes np=ne, so the paired proton rates may join the effective electron collision matrix.
  - Collapsed n=4,5 shells retain statistical orbital populations.
  evidence:
  - psm20_source
  - dilute_followup_record
- id: hydrogenic_bound_free
  revision: '1'
  latex: 't^2=\frac{h\nu}{\chi_{n\ell}}-1,\quad \kappa=t/n,\\

    \sigma_{n\ell}=\frac{4\pi\alpha a_0^2n^2}{3}

    \sum_{\ell''=\ell\pm1\ge0}\frac{\max(\ell,\ell'')}{2\ell+1}(1+t^2)

    \mathcal D_{n\ell,\ell''}^2,\\

    \mathcal D_{n\ell,\ell''}^2=\frac{(n+\ell)!}{(n-\ell-1)!}(2n)^{2(\ell-n)}

    \prod_{s=1}^{\ell''}(1+s^2\kappa^2)[G_\ell^{\pm}]^2,\\

    \overline\sigma_n=\sum_{\ell=0}^{n-1}\frac{2\ell+1}{n^2}\sigma_{n\ell}'
  description: Coulomb-wave bound-free dipoles resolve orbital states; collapsed shells average their cross
    sections statistically.
  scope: 1<=n<=5; sigma=0 below the actual finite-state threshold. The radial functions are defined by the
    following recurrence.
  symbols:
    principal:
      latex: n
      description: Principal quantum number
      unit: '1'
    orbital:
      latex: \ell
      description: Bound-state orbital quantum number
      unit: '1'
    relative_energy:
      latex: h\nu/\chi_{n\ell}
      description: Photon energy divided by the level threshold
      unit: '1'
    frequency:
      latex: \nu
      description: Photon frequency
      unit: Hz
    cross_section:
      latex: \sigma_{n\ell}
      description: Orbital-resolved photoionization cross section
      unit: cm^2
    radial:
      latex: \mathcal D,G^\pm
      description: Dimensionless Coulomb radial factors
      unit: '1'
    threshold:
      latex: \chi_{n\ell}
      description: Finite-level ionization threshold
      unit: erg
  assumptions:
  - Resolved states are 1s,2s,2p,3s,3p,3d; n=4,5 are collapsed.
  - Hydrogenic Coulomb dipoles are evaluated at the selected level threshold.
  - No fitted correction is applied to n2/n3 populations.
  evidence:
  - brocklehurst_source
  - authored_rate_formulation
- id: brocklehurst_recurrence
  revision: '1'
  latex: 'G_0^*=\sqrt{\frac\pi2}\frac{8n(4n)^n}{(2n-1)!}

    \frac{e^{-2n\arctan(t)/t}}{\sqrt{1-e^{-2\pi/\kappa}}(1+t^2)^{n+2}},\\

    G^+_{n-1}=G_0^*,\quad G^+_{n-2}=n(2n-1)(1+t^2)G_0^*,\\

    G^-_{n-1}=\frac{1+t^2}{2n}G_0^*,\quad

    G^-_{n-2}=(2n-1)[4+(n-1)(1+t^2)]G^-_{n-1},\\

    A_q^+=4n^2-4(q+2)^2+(q+2)(2q+3)(1+t^2),\\

    B_q^+=4n^2[n^2-(q+2)^2][1+(q+3)^2\kappa^2],\\

    A_q^-=4n^2-4(q+1)^2+(q+1)(2q+3)(1+t^2),\\

    B_q^-=4n^2[n^2-(q+2)^2][1+(q+1)^2\kappa^2],\\

    G_q^\pm=A_q^\pm G_{q+1}^\pm-B_q^\pm G_{q+2}^\pm'
  description: Finite downward recurrence used to evaluate the hydrogenic radial factors without population
    fitting.
  scope: The plus recurrence runs q=n-3,...,0 and the minus recurrence q=n-3,...,1. Use initial values only
    for existing indices.
  symbols:
    principal:
      latex: n
      description: Principal quantum number
      unit: '1'
    orbital:
      latex: \ell
      description: Bound-state orbital quantum number
      unit: '1'
    relative_energy:
      latex: 1+t^2
      description: Photon energy divided by threshold
      unit: '1'
    radial:
      latex: G_q^\pm
      description: Radial recurrence quantities
      unit: '1'
    continuum:
      latex: \kappa=t/n
      description: Dimensionless continuum momentum
      unit: '1'
  assumptions:
  - At threshold arctan(t)/t approaches one and exp(-2pi/kappa) approaches zero.
  - Small-t series avoids a singular intermediate and preserves differentiation.
  - Ordinary float64 is restricted to n<=5; high-n overflow behavior is not inferred.
  evidence:
  - brocklehurst_source
  - authored_rate_formulation
- id: paired_continuum_kernels
  revision: '1'
  latex: "\\eta_\\nu=\\frac{c^2J_\\nu}{2h\\nu^3},\\quad\n a_i=\\frac{g_i}{2}\\left(\\frac{h^2}{2\\pi m_e k_{\\\
    rm B}T}\\right)^{3/2}\n e^{-(h\\nu-\\chi_i)/(k_{\\rm B}T)},\\\\\n\\Gamma_i=\\frac{8\\pi}{c^2}\\int\\nu^2\\\
    sigma_i\\eta_\\nu\\,d\\nu,\\quad\n\\alpha_i=\\frac{8\\pi}{c^2}\\int\\nu^2\\sigma_i a_i(1+\\eta_\\nu)\\\
    ,d\\nu,\\\\\n\\chi_\\nu^{\\rm bf}=\\sum_i\\sigma_i(n_i-n_en_pa_i),\\quad\nj_\\nu^{\\rm bf}=\\frac{2h\\\
    nu^3}{c^2}n_en_p\\sum_i\\sigma_i a_i"
  description: One photoionization cross section supplies its inverse Milne rate and continuum absorption/emission.
  scope: Included bound-free processes only; other free-free and line kernels are unchanged and separately
    recorded in the earlier coupled formulation.
  symbols:
    temperature: *id004
    electron_density: *id005
    frequency:
      latex: \nu
      description: Frequency
      unit: Hz
    occupation:
      latex: \eta_\nu
      description: Photon occupation number
      unit: '1'
    weight:
      latex: d\nu
      description: Frequency quadrature measure
      unit: Hz
    population:
      latex: n_i
      description: Bound population
      unit: cm^-3
    cross_section:
      latex: \sigma_i
      description: The same orbital-resolved or collapsed cross section in every kernel
      unit: cm^2
    rates:
      latex: \Gamma_i,\alpha_i
      description: Photoionization and radiative recombination coefficients
      unit: s^-1, cm^3 s^-1
    transfer:
      latex: \chi_\nu^{\rm bf},j_\nu^{\rm bf}
      description: Bound-free extinction and emissivity
      unit: cm^-1, erg s^-1 cm^-3 sr^-1 Hz^-1
  assumptions:
  - Maxwellian electrons at the gas temperature; stimulated recombination is retained.
  - The same selected quadrature and cross section must be used in local rates and coupled continuum transfer.
  evidence:
  - authored_rate_formulation
