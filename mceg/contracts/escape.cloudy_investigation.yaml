- id: psm20_source
  kind: literature
  summary: PSM20 impact-parameter cross section and Maxwellian integration with lifetime and Debye cutoffs.
  sources:
  - https://doi.org/10.1093/mnras/stab2266
  - https://amdpp.phys.strath.ac.uk/tamoc/PUB/2021/mnras_507_2922.pdf
  scope: Badnell et al. 2021, equations 6-12 and 22; a specified approximate degenerate-state collision model,
    not exact low-n quantum scattering.
  provenance:
    role: primary
    location: MNRAS 507, 2922, equations 6-12 and 22
    inspection: inspected
    note: Primary formulas inspected during implementation; the runtime uses their combined cutoff integral
      at all densities.
- id: brocklehurst_source
  kind: literature
  summary: Hydrogenic Coulomb bound-free dipoles and radial recurrence.
  sources:
  - https://doi.org/10.1093/mnras/153.4.471
  scope: Brocklehurst 1971, equations 3.13 and 3.17-3.24; implemented through the inspected Cloudy C23.01 recurrence
    for n<=5.
  provenance:
    role: primary
    location: MNRAS 153, 471; defining equations cited by hydro_bauman.cpp
    inspection: partial
    note: The exact recurrence and normalization were inspected in Cloudy source and checked against retained
      reference anchors; direct inspection of every original-paper derivation is not claimed.
